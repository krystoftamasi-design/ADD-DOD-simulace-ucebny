<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Učebna · simulátor maskota</title>
  <link rel="stylesheet" href="src/style.css?v=model-toggle-r1">
  <script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
  <main>
    <div id="scene"><div class="loading" id="loading">Připravuji učebnu…</div></div>
    <details class="controls">
      <summary><span aria-hidden="true">☰</span> Ovládání</summary>
      <div class="controls-panel">
        <label for="route">Trasa maskota</label>
        <select id="route"><option value="all">Všech 10 obrazovek · 1 → 10</option><option value="pair">Dvě obrazovky · 8 ↔ 7</option></select>
        <label for="speed">Rychlost <span id="speed-value">1×</span></label>
        <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1">
        <div class="buttons"><button id="play">Pozastavit</button><button id="reset">Výchozí pohled</button></div>
        <div class="view-controls" aria-label="Pohled"><button id="eye" class="active">Od návštěvníka</button><button id="top">Nadhled</button></div>
        <button id="model-toggle" class="table-view" aria-pressed="false">Skrýt 3D model</button>
        <button id="table-view" class="table-view">Projekční stůl</button>
        <button id="projection-open" class="table-view">Zvětšit projekci</button>
        <button id="guide-open" class="table-view" hidden>Jak rozhodl Tev1</button>
        <div class="flick-controls"><label class="simulate-toggle"><input id="simulate-all" type="checkbox"> Simulovat všechny počítače</label><button id="room-identify">Čísla na obrazovkách</button><button id="floating-mode" class="table-view">Plovoucí maskot</button><button id="spawn-reset" class="table-view">Znovu čekat na návštěvníka</button><button id="room-experiment" class="table-view">Množení kuliček</button><p id="room-status" role="status">Připojuji obrazovky v učebně…</p></div>
        <div class="flick-controls">
          <button id="flick-connect">Připojit Flick</button>
          <p id="flick-status" role="status">Flick odpojen</p>
          <a id="flick-local" href="http://127.0.0.1:8765/" hidden>Otevřít s Flickem lokálně</a>
        </div>
      </div>
    </details>
    <dialog id="projection-preview" aria-label="Promítaná plocha">
      <button id="projection-close" aria-label="Zavřít promítanou plochu" title="Zavřít (Esc)">×</button>
    </dialog>
    <dialog id="guide-preview" aria-labelledby="guide-title">
      <header><h2 id="guide-title">Průvodce · Jak rozhodl Tev1</h2><button id="guide-close" aria-label="Zavřít průvodce">×</button></header>
      <iframe id="guide-frame" title="Průvodce studentskými pracemi a rozhodování Tev1"></iframe>
    </dialog>
  </main>
  <script src="classroom/timeline.js?v=spawn-r2"></script>
  <script src="classroom/sync.js"></script>
  <script type="module" src="room/mascot.js?v=text-editor-r2"></script>
  <script type="module" src="src/app.js?v=windows-r1"></script>
</body>
</html>
