<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOD · obrazovka</title>
<style>html,body{width:100%;height:100%;padding:0;margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%}#fullscreen{position:absolute;right:14px;top:14px;border:1px solid #53606b;border-radius:6px;padding:9px 12px;color:#eef4e5;background:#23313b;cursor:pointer}#status{position:absolute;bottom:14px;left:16px;color:#a8b4bd;font-size:13px;pointer-events:none}#stage{transform-origin:0 0}#calibration-bar{position:absolute;z-index:5;left:14px;top:14px;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s;color:#eef4e5;font:13px Arial,sans-serif}#calibration-bar.visible,#calibration-bar.editing,#calibration-bar:focus-within{opacity:1;pointer-events:auto}#calibration-bar button{border:1px solid #53606b;border-radius:6px;padding:9px 12px;color:#eef4e5;background:#23313b;cursor:pointer}#calibration-actions:not([hidden]){display:flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;border-radius:8px;background:#111d} .calibration-point{position:absolute;z-index:4;width:28px;height:28px;padding:0;border:3px solid white;border-radius:50%;background:#1687ed;box-shadow:0 0 0 2px #172331,0 2px 8px #0009;transform:translate(-50%,-50%);touch-action:none;cursor:grab}.calibration-point:active{cursor:grabbing}.calibration-point[hidden]{display:none}body.projector:not(.calibrating) #fullscreen,body.projector:not(.calibrating) #calibration-bar{display:none!important}</style>
